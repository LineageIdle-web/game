ound:var(--mana);width:0;height:100%;transition:width .16s linear}#battle-log{height:122px;background:rgba(0,0,0,.84);border-radius:8px;padding:10px;font-size:11px;color:#d2d6e4;overflow-y:auto;text-align:left;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid #343845;line-height:1.45}.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:65px;background:#1d2028;display:flex;border-top:1px solid #343845;z-index:10}.nav-btn{flex:1;background:none;border:none;color:#9399aa;font-size:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;gap:4px}.nav-btn .icon{font-size:18px}.nav-btn.active{color:var(--accent);background:#282c36}.sub-tabs{display:flex;gap:8px;margin:0 0 10px}.sub-btn{flex:1;border:1px solid #444b5c;background:rgba(28,31,40,.95);color:#c9cede;border-radius:8px;padding:9px;font-weight:700;cursor:pointer}.sub-btn.active{color:#111;background:var(--accent);border-color:var(--accent)}.town-hero-row,.card{background:rgba(31,34,43,.92);border:1px solid #444b5c;border-radius:8px;padding:12px;margin-bottom:10px}.town-hero-row{display:flex;align-items:center;gap:12px}.town-avatar{width:56px;height:56px;object-fit:contain;background:#252935;border-radius:8px;border:1px solid #555d70}.town-info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.town-info h4,.card h4{margin:0;color:var(--accent);font-size:14px}.town-info p,.card p{margin:3px 0;font-size:11px;color:#c9cede;line-height:1.35}.skill-desc{color:#8fd8ff!important;font-style:italic}.btn{background:#ffca28;border:none;padding:8px 10px;border-radius:4px;font-weight:700;cursor:pointer;font-size:12px;color:#111}.btn.secondary{background:#3b4050;color:#e8ebf5;border:1px solid #5a6275}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.material-row,.monster-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding:7p .enemy-wrap{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:6px;max-width:360px;margin:0 auto;width:100%}.enemy-status-list{min-height:96px;display:flex;flex-direction:column;gap:4px;justify-content:center}.enemy-status-list.left{text-align:right;align-items:flex-end}.enemy-status-list.right{text-align:left;align-items:flex-start}.status-pill{max-width:100%;font-size:10px;line-height:1.2;border:1px solid #555d70;border-radius:999px;padding:3px 6px;background:rgba(34,38,49,.92);color:#e8ebf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-pill.bad{border-color:#8f3f3f;color:#ffb5b5;background:rgba(80,25,25,.86)}.status-pill.good{border-color:#4c7e6f;color:#b8ffe9;background:rgba(20,60,50,.8)}.team-buffs{min-height:42px;background:rgba(0,0,0,.62);border:1px solid #343845;border-radius:8px;padding:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}.team-buffs-title{font-size:11px;color:#a9afc3;margin-right:2px}.mini-buff{font-size:10px;border:1px solid #555d70;border-radius:999px;background:#252936;color:#e8ebf5;padding:3px 7px;white-space:nowrap}.mini-buff.personal{position:absolute;top:2px;right:2px;padding:1px 4px;font-size:10px;border-radius:7px;background:rgba(0,0,0,.65);border:1px solid #555d70}.enemy-card{grid-column:2}.talent-owned{color:#18d6a3;font-weight:700}.talent-locked{color:#a9afc3}

.commission-card{border-color:#6a5a2a;background:linear-gradient(180deg,#28251d,#1f222b)}

.area-selector{grid-template-columns:1fr}.area-select-btn{width:100%;border:1px solid #6b5b2a;background:linear-gradient(180deg,#3a3119,#242733);color:#ffdf70;border-radius:10px;padding:10px;font-weight:900;cursor:pointer}.area-list{display:flex;flex-direction:column;gap:8px}.area-card,.dragon-card{background:#252936;border:1px solid #444b5c;border-radius:8px;padding:10px;text-align:left;margin-bottom:8px}.area-card.active-area{border-color:#ffca28;box-shadow:0 0 12px rgba(255,202,40,.25)}.area-card.locked,.dragon-locked{opacity:.45}.area-card h4,.dragon-card h4{margin:0 0 5px;color:#ffca28}.dragon-card{background:linear-gradient(180deg,#302333,#1e2028);border-color:#654f78}.dragon-card h4{color:#d7b5ff}.trial-badge{display:inline-block;border:1px solid #8e6bff;color:#e0d4ff;background:#2d2340;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:4px}.morph-stars{color:#ffd54f;font-size:12px}.dragon-shop-link{cursor:pointer;color:#ffdf70;text-decoration:underline;font-weight:900}.growth-research-card{background:linear-gradient(180deg,#2e2418,#1f222b);border-color:#7a5f2a}.dog-track{background:#11141b;border:1px solid #444b5c;border-radius:10px;padding:10px;margin:10px 0}.dog-row{display:flex;align-items:center;gap:8px;margin:7px 0}.dog-name{width:92px;font-size:12px;color:#e8ebf5;text-align:left}.dog-lane{flex:1;height:13px;background:#2d3340;border-radius:999px;overflow:hidden;position:relative}.dog-runner{position:absolute;left:0;top:-3px;font-size:16px;transition:left .7s ease}.dog-row.winner .dog-lane{box-shadow:0 0 10px rgba(255,202,40,.35);border:1px solid #ffca28}.research-card{border-color:#514a62}.research-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.research-result{background:#202431;border:1px solid #4d566c;border-radius:8px;padding:8px;font-size:12px;line-height:1.5;margin-top:8px}

<body>
<div id="phone-wrapper">
  <div class="top-bar"><div class="top-left"><button class="stat-btn" onclick="openStatsModal()">📊 統計</button><button class="stat-btn" onclick="openCommissionModal()">📜 委託</button><span><span id="top-area">說話之島</span> <span id="top-monster">哥布靈</span>｜隊伍 Lv.<span id="team-level-top">1</span></span></div><div class="gold-display">金幣: <span id="gold-val">0</span></div></div>
  <div id="main-content" class="main-content">
    <div id="panel-battle" class="game-panel active">
      <div class="battle-panel-container">
        <div class="battle-stage">
          <div class="area-selector" id="area-selector"></div>
          <div class="area-progress"><b id="area-progress-title">說話之島</b> <span id="area-progress-text">0 / 1000</span><div class="thin-bar"><div class="thin-fill" id="area-progress-fill"></div></div></div><div class="exp-progress"><b>隊伍經驗</b> <span id="team-exp-text">0 / 100</span><div class="thin-bar"><div class="exp-fill" id="team-exp-fill"></div></div></div>
          <div class="battle-info"><span id="battle-state">自動戰鬥中</span><span id="party-power">戰力 0</span></div>
          <div class="enemy-wrap"><div id="enemy-buffs" class="enemy-status-list left"></div><div class="enemy-card" id="enemy-card"><div id="boss-badge" class="boss-badge">BOSS</div><div id="enemy-status" class="status-badge" style="display:none;">暈眩</div><div class="name" id="enemy-name">哥布靈</div><img id="enemy-visual" class="enemy-avatar" src="hot/default.png" alt="哥布靈" onerror="this.onerror=null;this.src='hot/default.png'"><div class="bar-container"><div class="hp-bar" id="enemy-hp"></div></div><div class="bar-container" id="enemy-cast-wrap" style="display:none"><div class="sp-bar" id="enemy-cast"></div></div></div><div id="enemy-debuffs" class="enemy-status-list right"></div></div>
          <div class="heroes-container" id="heroes-container"></div>
        </div>
        <div id="battle-log">亞丁勇者小隊集結完畢，開始掛機刷怪...</div><div id="team-buffs" class="team-buffs"><span class="team-buffs-title">隊伍效果</span><span class="muted">目前沒有狀態</span></div>
      </div>
    </div>
    <div id="panel-town" class="game-panel"><h3 class="panel-title">主城</h3><div class="sub-tabs"><button class="sub-btn active" onclick="switchTownSub('team', this)">隊伍</button><button class="sub-btn" onclick="switchTownSub('codex', this)">圖鑑</button><button class="sub-btn" onclick="switchTownSub('morph', this)">變身</button></div><div id="town-team"></div><div id="town-codex" style="display:none"></div><div id="town-morph" style="display:none"></div></div>
    <div id="panel-artifact" class="game-panel"><h3 class="panel-title">神器</h3><div class="sub-tabs"><button class="sub-btn active" onclick="switchArtifactSub('artifacts', this)">神器</button><button class="sub-btn" onclick="switchArtifactSub('materials', this)">材料</button></div><div id="artifact-list"></div><div id="material-list" style="display:none"></div></div>
    <div id="panel-shop" class="game-panel"><h3 class="panel-title">商店</h3><div id="shop-list"></div></div>
    <div id="panel-talent" class="game-panel"><h3 class="panel-title">成長</h3><div class="sub-tabs"><button class="sub-btn active" onclick="switchGrowthSub('talent', this)">天賦</button><button class="sub-btn" onclick="switchGrowthSub('research', this)">研究</button></div><div id="talent-list"></div><div id="research-list" style="display:none"></div><div class="reset-zone"><button class="danger-btn" onclick="resetSave()">刪除存檔重新開始</button></div></div>
  </div>

  <div id="stats-modal" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h3>📊 冒險統計</h3><button class="close-btn" onclick="closeStatsModal()">關閉</button></div><div class="stat-tabs"><button class="stat-tab active" onclick="switchStatsSub('battle', this)">戰鬥</button><button class="stat-tab" onclick="switchStatsSub('economy', this)">經濟</button><button class="stat-tab" onclick="switchStatsSub('drops', this)">掉落</button></div><div id="stats-content"></div></div></div>

  <div id="commission-modal" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h3>📜 冒險委託</h3><button class="close-btn" onclick="closeCommissionModal()">關閉</button></div><div id="commission-content"></div></div></div>
  <div id="area-modal" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h3>🗺️ 地區選擇</h3><button class="close-btn" onclick="closeAreaModal()">關閉</button></div><div class="stat-tabs"><button class="stat-tab active" onclick="switchAreaModalSub('normal', this)">一般地圖</button><button class="stat-tab" onclick="switchAreaModalSub('dungeon', this)">副本</button></div><div id="area-modal-content"></div></div></div>
  <div id="morph-modal" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h3>🎭 使用變形卷軸</h3><button class="close-btn" onclick="closeMorphPicker()">關閉</button></div><p class="muted">消耗 1 張變形卷軸，選擇一種已解鎖變身，效果持續 240 秒。一次只能存在一種變身。</p><div id="morph-picker-list"></div></div></div>
  <div id="dragon-shop-modal" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><h3>🐉 龍魂兌換</h3><button class="close-btn" onclick="closeDragonShop()">關閉</button></div><div id="dragon-shop-content"></div></div></div>
  <div class="bottom-nav"><button class="nav-btn" onclick="switchTab('town', this)"><span class="icon">🏰</span>主城</button><button class="nav-btn active" onclick="switchTab('battle', this)"><span class="icon">⚔️</span>戰鬥</button><button class="nav-btn" onclick="switchTab('artifact', this)"><span class="icon">✨</span>神器</button><button class="nav-btn" onclick="switchTab('shop', this)"><span class="icon">💰</span>商店</button><button class="nav-btn" onclick="switchTab('talent', this)"><span class="icon">📈</span>成長</button></div>
</div>
<script>
const SAVE_KEY = "lineageIdleV14TowerSave";
const TICK_MS = 560, REVIVE_DELAY_MS = 10000;
const HERO_ASSETS = ["poo/主角1.png","poo/主角2.png","poo/主角3.png","poo/主角4.png","poo/主角sor5.png"];

const BATTLE_BG = "room/背景2.png", TOWN_BG = "room/背景1.png";

    const old=saved.heroes?.find(x=>x.id===h.id);
    if(!old) return h;
    return {...h, bonusLv:Number(old.bonusLv||0), scrollAtk:Number(old.scrollAtk||0), scrollHp:Number(old.scrollHp||0)};
   });

function scaleHero(hero, heal=true){

 const st=stats();
 const roleByHero={0:"royal",1:"knight",2:"elf",3:"mage",4:"dark"};
 const overMastery=Math.max(0,(player.mastery[roleByHero[hero.id]]||0)-20);
 hero.maxHp=Math.round((base.hp*(1+(hero.lv-1)*.16)+Number(hero.scrollHp||0)+(st.hpFlat||0))*(1+st.hpPct/100)*(1+overMastery/100));
 hero.atk=Math.round((base.atk*(1+(hero.lv-1)*.13)+Number(hero.scrollAtk||0)+(st.atkFlat||0))*(1+st.atkPct/100)*(1+overMastery/100));
 hero.attackBuff=hero.attackBuff||1;
 if(heal)hero.hp=hero.maxHp; else { const cur=(typeof hero.hp==='number')?hero.hp:hero.maxHp; hero.hp=Math.min(cur,hero.maxHp); }

const commissionRanks = {
 easy:{label:"簡單", cls:"rank-easy", chance:60, kill:[200,400], material:[50,75], gold:[2000,6000], dust:[10,25]},
 normal:{label:"普通", cls:"rank-normal", chance:30, kill:[400,600], material:[100,150], gold:[5000,10000], dust:[30,30]},
 hard:{label:"困難", cls:"rank-hard", chance:10, kill:[800,1200], material:[200,200], gold:[10000,30000], dust:[70,70]}
};
function commissionMaterialPool(rank){
 const maxIndex=Math.max(0, Math.min(player.unlockedAreas-1, areas.length-1));
 const set=new Set();
 for(let i=0;i<=maxIndex;i++) areas[i].drops.forEach(m=>set.add(m));
 return Array.from(set);
}
function generateCommission(){
 const r=Math.random()*100;
 const rank=r<60?"easy":(r<90?"normal":"hard");
 const cfg=commissionRanks[rank];
 const type=Math.random()<0.65?"kill":"material";
 const id=`${Date.now()}_${Math.floor(Math.random()*999999)}`;
 if(type==="material"){
  const pool=commissionMaterialPool(rank);
  const mat=pool[Math.floor(Math.random()*pool.length)];
  const need=randomInt(cfg.material[0],cfg.material[1]);
  return {id,rank,type,material:mat,need,progress:0,claimed:false};
 }
 const need=randomInt(cfg.kill[0],cfg.kill[1]);
 return {id,rank,type,need,progress:0,claimed:false};
}
function commissionTitle(c){
 const cfg=commissionRanks[c.rank]||commissionRanks.easy;
 if(c.type==="material") return `${cfg.label}委託：提交${c.material}`;
 return `${cfg.label}委託：怪物掃蕩`;
}
function commissionProgressText(c){
 if(c.type==="material") return `${player.materials[c.material]||0} / ${c.need}`;
 return `${Math.min(c.progress||0,c.need)} / ${c.need}`;
}
function commissionReady(c){
 if(!c)return false;
 if(c.type==="material") return (player.materials[c.material]||0)>=c.need;
 return (c.progress||0)>=c.need;
}
function commissionRewardText(c){
 const cfg=commissionRanks[c.rank]||commissionRanks.easy;
 let parts=[`${cfg.gold[0]}~${cfg.gold[1]}金幣`, cfg.dust[0]===cfg.dust[1]?`星塵${cfg.dust[0]}`:`星塵${cfg.dust[0]}~${cfg.dust[1]}`];
 if(c.rank==="normal") parts.push("天賦 +1");
 if(c.rank==="hard") parts.push("隨機卷軸 x1", "漂浮之眼肉 x1");
 return parts.join("、");
}

 if(!player.commission) player.commission=generateCommission();

 box.innerHTML=`<div class="card commission-card"><div class="commission-title"><h4>${commissionTitle(c)}</h4><span class="commission-rank ${cfg.cls}">${cfg.label}</span></div><p class="muted">${c.type==="material"?"提交指定材料完成委託。":"擊殺任意怪物即可推進，不指定怪物名稱。"}</p><div class="commission-progress">進度：<b>${commissionProgressText(c)}</b></div><p>獎勵：${commissionRewardText(c)}</p><div class="commission-actions"><button class="btn" ${ready?'':'disabled'} onclick="claimCommission()">領取委託獎勵</button><button class="btn secondary" ${player.refineStones>0?'':'disabled'} onclick="rerollCommission()">放棄並刷新：洗鍊石 x1</button></div></div><p class="muted">委託一次只會存在一個。完成後領取獎勵，會自動刷新下一個委託。</p>`;
}

function claimCommission(auto=false){
 const c=player.commission; if(!commissionReady(c))return;
 const cfg=commissionRanks[c.rank]||commissionRanks.easy;
 if(c.type==="material") player.materials[c.material]-=c.need;
 const gold=randomInt(cfg.gold[0],cfg.gold[1]); const dust=randomInt(cfg.dust[0],cfg.dust[1]);
 player.gold+=gold; player.starDust+=dust;
 player.stats.totalGoldEarned=(player.stats.totalGoldEarned||0)+gold;
 player.stats.starDustEarned=(player.stats.starDustEarned||0)+dust;
 const got=[`${gold}金幣`,`星塵 x${dust}`];
 if(c.rank==="normal"){ player.talentPoints++; got.push("天賦點 x1"); }
 if(c.rank==="hard"){ got.push(grantScroll(weightedScrollDrop())); player.floatingEyeMeat=(player.floatingEyeMeat||0)+1; player.stats.floatingEyeMeatEarned=(player.stats.floatingEyeMeatEarned||0)+1; got.push("漂浮之眼肉 x1"); }
 player.stats.commissionCompleted=(player.stats.commissionCompleted||0)+1;
 log(`${auto?"自動完成":"完成"}${commissionTitle(c)}，獲得 ${got.join("、")}。`, true);

}
function rerollCommission(){

 player.refineStones--; player.commission=generateCommission();

function starUpgradeCost(stars){ const dust=[50,150,400,900,1800][stars]||9999; return {dust, materials:{}}; }
function craftArtifact(id){ const a=artifacts.find(x=>x.id===id), st=player.artifactState[id]; if(st.crafted)return; if(player.gold<a.goldCost)return; if(!Object.entries(a.recipe).every(([m,n])=>(player.materials[m]||0)>=n))return; player.gold-=a.goldCost; player.stats.totalGoldSpent=(player.stats.totalGoldSpent||0)+a.goldCost; Object.entries(a.recipe).forEach(([m,n])=>player.materials[m]-=n); st.crafted=true; st.stars=0; st.affixes=[]; saveGame(); renderAll(); log(`成功製作神器：${a.name}。`); }

function randomAffix(){
 const total=affixDefs.reduce((s,x)=>s+x.weight,0); let r=Math.random()*total; let def=affixDefs[0];
 for(const it of affixDefs){ r-=it.weight; if(r<=0){def=it; break;} }
 const value=randomInt(def.min,def.max);
 return {name:`${def.label} +${value}${def.suffix}`, stat:def.stat, value, rarity:""};
}

function battleTick(){

  if(dragonTrial){ enemy.hp=enemy.maxHp; }
  else if(towerTrial){ winTowerFloor(); return; }
  else { winBattle(); return; }

 }

}

function dealDamage(h,amount,isSkill){

  c.innerHTML=`<div class="stat-grid">${statTile('累積獲得金幣',formatNumber(ps.totalGoldEarned))}${statTile('累積消耗金幣',formatNumber(ps.totalGoldSpent))}${statTile('目前持有金幣',formatNumber(player.gold))}${statTile('離線獲得金幣',formatNumber(ps.offlineGold))}${statTile('精靈餅乾使用',formatNumber(ps.elfCookieUsed))}${statTile('自我加速使用',formatNumber(ps.hastePotionUsed))}${statTile('勇敢藥水使用',formatNumber(ps.braveryPotionUsed))}${statTile('離線擊殺',formatNumber(ps.offlineKills))}</div>`;
 }else{
  c.innerHTML=`<div class="stat-grid">${statTile('洗鍊石獲得',formatNumber(ps.refineStonesEarned))}${statTile('星塵獲得',formatNumber(ps.starDustEarned))}${statTile('武卷獲得',formatNumber(ps.weaponScrollEarned))}${statTile('防卷獲得',formatNumber(ps.armorScrollEarned))}${statTile('祝武獲得',formatNumber(ps.blessedWeaponScrollEarned))}${statTile('祝防獲得',formatNumber(ps.blessedArmorScrollEarned))}${statTile('解除封印卷軸',formatNumber(ps.sealScrollEarned))}${statTile('變形卷軸',formatNumber(ps.morphScrollEarned))}${statTile('龍魂獲得',formatNumber(ps.dragonSoulEarned))}${statTile('目前龍魂',formatNumber(player.dragonSoul))}${statTile('漂浮之眼肉',formatNumber(player.floatingEyeMeat))}</div>`;
 }
}
function applyOfflineGains(){
 const now=Date.now(), last=Number(player.lastSeen||now), elapsed=Math.max(0,now-last); if(elapsed<60000)return;
 const capped=Math.min(elapsed,4*60*60*1000); const area=areas[player.areaIndex]; const kills=Math.floor((capped/1000)/6*0.30); if(kills<=0)return;
 let gold=0, exp=0; const mats={};
 for(let i=0;i<kills;i++){
  const g=randomGoldForArea(area); gold+=g; exp+=Math.round(20*area.exp*(1+areaPowerIndex()*.22));
  const mon=area.monsters[Math.floor(Math.random()*area.monsters.length)]; player.monsterKills[mon]=(player.monsterKills[mon]||0)+1;
  if(area.final){ if(Math.random()<.55){ const m=area.drops[Math.floor(Math.random()*area.drops.length)]; mats[m]=(mats[m]||0)+1; }}
  else { const m=area.drops[Math.floor(Math.random()*area.drops.length)]; mats[m]=(mats[m]||0)+1; }
 }
 if(!area.final) player.areaKills[player.areaIndex]=(player.areaKills[player.areaIndex]||0)+kills;
 checkAreaUnlock(area);
 const st=stats(); gold=Math.round(gold*(1+st.goldPct/100)); exp=Math.round(exp*(1+st.expPct/100));
 player.gold+=gold; player.stats.totalGoldEarned=(player.stats.totalGoldEarned||0)+gold; player.stats.offlineGold=(player.stats.offlineGold||0)+gold; player.stats.offlineExp=(player.stats.offlineExp||0)+exp; player.stats.offlineKills=(player.stats.offlineKills||0)+kills; player.stats.totalKills=(player.stats.totalKills||0)+kills; addDragonRechargeKills(kills); addDogRaceKills(kills); if(player.commission&&player.commission.type==='kill'){ player.commission.progress=(player.commission.progress||0)+kills; if(commissionReady(player.commission)) claimCommission(true); }
 Object.entries(mats).forEach(([m,n])=>player.materials[m]=(player.materials[m]||0)+n);
 gainTeamExp(exp);
 log(`離線 ${formatDuration(capped)}，獲得 ${gold} 金幣、${exp} EXP、普通素材 ${Object.values(mats).reduce((a,b)=>a+b,0)} 個。`, true);
 saveGame();
}

function resetSave(){
 if(!confirm("確定要刪除目前所有存檔並重新開始嗎？此動作無法復原。"))return;
 const text=prompt("請輸入：刪除存檔");
 if(text!=="刪除存檔"){ alert("未輸入正確文字，已取消。"); return; }
 localStorage.removeItem(SAVE_KEY); location.reload();
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); else { applyOfflineGains(); lastFrame=performance.now(); tickCarry=0; renderAll(); }});
window.addEventListener("beforeunload",()=>saveGame());
loadGame(); heroes=heroes.map(h=>scaleHero(h,false)); renderHeroes(); renderAll(); setBackground("battle"); applyOfflineGains(); spawnEnemy(); requestAnimationFrame(gameFrame);
</script>
